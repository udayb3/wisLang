<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap</title>
  <link	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"	/>
  <style>
		.flex-container1 {
			display: table-column;
			height: 50vh;
			justify-content: left;
			align-items: left;
		}
		.flex-container2 {
			display: table-column;
			height: 50vh;
			justify-content: right;
			align-items: right;
		}
  </style>
</head>

<body>
  <div class="flex-container1">
    <div class="card" style="width: 18rem;">
			<img src="./flower.jpg" class="card-img-top" alt="Sunflower">
			<div class="card-body">
				<h5 class="card-title">Sunflower</h5>
				<p class="card-text">Sunflower is the species of large annual forb.</p>
				<a href="./goal.png" class="btn btn-primary">Go somewhere</a>
			</div>
		</div>
  </div>
  <div class="flex-container2">
    <div class="card" style="width: 18rem;">
			<img src="./flower.jpg" class="card-img-top" alt="Sunflower">
			<div class="card-body">
				<h5 class="card-title">Sunflower</h5>
				<p class="card-text">Sunflower is the species of large annual forb.</p>
				<a href="./goal.png" class="btn btn-primary">Go somewhere</a>
			</div>
		</div>
  </div>

</body>

</html>
