<html lang="en">
	<head>
		<title>Account Form</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">"
		<link href="../static/style1.css" rel="stylesheet"/>
	</head>
	<body class="_main">
			<div>
				<div class="card">
					<div class="card text-bg-dark">
						Fill the Details required below
					</div>
				</div>
			</div>
			<br/>
			<form action="{{url_for('receive_data')}}" method="post"> 
				<div class="flex-container" id="gr">
							<div class="input-group input-group-lg">
								<span class="input-group-text">Name</span>
								<input type="text" class="form-control" name="username"		placeholder="Enter Username"  aria-label="Username">
								<span class="input-group-text">Password</span>
								<input type="text" class="form-control" name="password"		placeholder="Enter Password"  aria-label="Server">
								<span class="input-group-text">
								<button type="submit" class="btn btn-outline-primary">Ok</button>
								</span>
							</div>
					</div>	
			</form>
	</body>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</html>
