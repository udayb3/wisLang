<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blogs</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
<div class="wrapper">
    <div class="top">
        <div class="title"><h1>My Blog</h1></div>
    </div>
		{%for part in Dt:%}
    <div class="content">
        <div class="card">
            <h2>{{part['title']}}</h2>
            <p class="text">{{part['subtitle']}}</p>
            <a href="{{url_for('blog',_external=False,id=part['id'])}}">Read more</a>
        </div>
		</div>
		{%endfor%}
</body>
<footer>
    <p>Made in House.</p>
</footer>
</html>
