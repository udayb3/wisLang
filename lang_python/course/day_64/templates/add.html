{% extends 'base.html' %}

{% block title %}Add {{ DB }}{% endblock %}

{% block content %}
<div class="content">
    <h1 class="heading">Enter the details of the {{ DB }}</h1>
    <form action="" method="POST">
        
      <div class="mb-2">
      	  <label class="form-label" >{{ Question[0] }}</label>
        	<input type="text" class="form-control" name="title">
			</div>
			<div class="mb-2">
        <label class="form-label" >{{ Question[1] }}</label>
        <input type="number" class="form-control" min="1500" max="2100" name="year">
      </div>
			<div class="mb-2">	
				<label class="form-label" >{{ Question[2] }}</label>
        <input type="text" class="form-control" name="creator">
      </div>
			<div class="mb-2">
				<label class="form-label" >{{ Question[3] }}</label>
        <input type="floatformat" class="form-control" name="rating" min="0.00" max="10.00">
      </div>
			<div class="mb-2">
				<label class="form-label" >{{ Question[4] }}</label>
        <input type="text" class="form-control" name="one_liner">
      </div>
			<div class="mb-2">
				<label class="form-label" >{{ Question[5] }}</label>
        <input type="text" class="form-control" name="description">
      </div>
			<div class="mb-2">
				<label class="form-label" >{{ Question[6] }}</label>
        <input type="url" class="form-control" name="url">
      </div>
				<button type="Submit" class="btn btn-outline-success btn-lg" >ADD</button>
    </form>
</div>
{% endblock %}
